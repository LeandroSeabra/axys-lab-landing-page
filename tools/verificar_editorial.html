<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Verificação local da área editorial</title></head><body><h1>Verificação local</h1><pre id="result" role="status">Executando…</pre><iframe title="Página em teste" style="border:0;height:1000px"></iframe><script>
(async () => {
  const result = document.querySelector('#result');
  const frame = document.querySelector('iframe');
  const paths = ['o-que-e-geofisica', 'geofisica-agua-subterranea-poco', 'gpr-localizar-tubulacoes', 'georreferenciamento-imovel-rural-sigef', 'monitoramento-geofisico-barragens'];
  const checks = [[320, '/conteudos/'], [768, '/conteudos/'], [1024, '/conteudos/'], [1440, '/conteudos/'], ...paths.map(path => [320, `/conteudos/${path}/`])];
  const assert = (value, message) => { if (!value) throw Error(message); };
  const messages = [];
  try {
    for (const [width, path] of checks) {
      frame.style.width = `${width}px`;
      await new Promise(resolve => { frame.onload = resolve; frame.src = path; });
      const doc = frame.contentDocument;
      assert(doc.documentElement.scrollWidth <= frame.clientWidth, `Transbordamento em ${width}px: ${path}`);
      assert(doc.querySelectorAll('h1').length === 1, `Título principal: ${path}`);
      for (const anchor of doc.querySelectorAll('a[href^="#"]')) assert(doc.getElementById(anchor.hash.slice(1)), `Âncora inexistente: ${anchor.hash}`);
      if (path === '/conteudos/') {
        const input = doc.querySelector('#search');
        const visible = () => [...doc.querySelectorAll('[data-category]')].filter(card => !card.hidden).length;
        assert(visible() === 5, 'Listagem inicial');
        doc.querySelector('[data-filter="Notícias"]').click();
        assert(visible() === 0 && !doc.querySelector('#empty').hidden, 'Filtro sem resultados');
        doc.querySelector('[data-filter="Todos"]').click();
        input.value = 'geofisica'; input.dispatchEvent(new frame.contentWindow.Event('input'));
        assert(visible() >= 1, 'Busca sem acento');
        input.value = 'xyz-inexistente'; input.dispatchEvent(new frame.contentWindow.Event('input'));
        assert(visible() === 0, 'Busca sem resultado');
        doc.querySelector('#reset').click(); assert(visible() === 5 && doc.activeElement === input, 'Limpar e devolver foco');
        const topic = doc.querySelector('#topic-filter'); topic.value = 'topografia';
        topic.dispatchEvent(new frame.contentWindow.Event('change'));
        assert(visible() === 1, 'Filtro por assunto');
        assert(new URL(frame.contentWindow.location.href).searchParams.get('tema') === 'topografia', 'Filtro compartilhável');
        doc.querySelector('[data-filter="Notícias"]').click();
        assert(visible() === 0, 'Combinação de assunto e formato');
        doc.querySelector('#reset').click();
        assert(topic.value === 'Todos' && visible() === 5, 'Limpar assunto e formato');
        doc.querySelector('[data-filter="Na prática"]').click();
        assert(visible() === 0 && new URL(frame.contentWindow.location.href).searchParams.get('formato') === 'pratica', 'Formato Na prática sem casos fictícios');
        doc.querySelector('#reset').click();

      } else {
        assert(doc.querySelectorAll('.article-conversion').length === 1, `Uma chamada contextual: ${path}`);
        assert(doc.querySelector('.article-references li'), `Referências presentes: ${path}`);
        const creditLinks = doc.querySelectorAll('.article-cover figcaption a');
        assert(creditLinks.length === 2 && [...creditLinks].every(link => link.protocol === 'https:'), `Fonte e licença da foto: ${path}`);
        assert(doc.querySelector('.article-cover img').getAttribute('src').startsWith('/assets/fotos/'), `Fotografia editorial: ${path}`);
        const schema = JSON.parse(doc.querySelector('script[type="application/ld+json"]').textContent);
        assert(schema.citation.length === doc.querySelectorAll('.article-references li').length, `Citações no schema: ${path}`);
      }
      if (width === 320) {
        const button = doc.querySelector('.menu-toggle'); button.click();
        assert(button.getAttribute('aria-expanded') === 'true', 'Menu móvel'); button.click();
      }
      messages.push(`PASS ${width}px ${path}`);
    }
    for (const route of ['/geo/', '/topo/', '/en/geo/']) {
      frame.style.width = '320px';
      await new Promise(resolve => { frame.onload = resolve; frame.src = route; });
      const doc = frame.contentDocument;
      assert(doc.documentElement.scrollWidth <= frame.clientWidth, `Serviço no celular: ${route}`);
      const explanation = doc.querySelector('.service-explainer');
      const demonstration = doc.querySelector('.g-target, .t-memorial');
      assert(explanation.compareDocumentPosition(demonstration) & 4, `Explicação antes da demonstração: ${route}`);
      const details = doc.querySelector('.faq details');
      details.querySelector('summary').click();
      assert(details.open && details.querySelector('p').textContent.trim(), `Resposta expansível: ${route}`);
      const guide = await fetch(explanation.querySelector('a').href);
      assert(guide.ok, `Guia acessível: ${route}`);
      messages.push(`PASS explicação e dúvidas 320px ${route}`);
    }
    for (const path of ['/conteudos/temas/geofisica/', '/conteudos/temas/topografia/', '/conteudos/noticias/', '/conteudos/politica-editorial/']) {
      for (const width of [320, 1440]) {
        frame.style.width = `${width}px`;
        await new Promise(resolve => { frame.onload = resolve; frame.src = path; });
        const doc = frame.contentDocument;
        assert(doc.documentElement.scrollWidth <= frame.clientWidth, `Portal sem transbordamento: ${path} ${width}`);
        assert(doc.querySelectorAll('h1').length === 1, `Título do portal: ${path}`);
        assert(!doc.querySelector('.cta'), `Sem chamada comercial genérica: ${path}`);
      }
      messages.push(`PASS coleção editorial ${path}`);
    }
    await new Promise(resolve => { frame.onload = resolve; frame.src = '/conteudos/?tema=topografia&formato=guias#biblioteca'; });
    assert([...frame.contentDocument.querySelectorAll('#biblioteca [data-category]')].filter(card => !card.hidden).length === 1, 'Filtro carregado pelo endereço');
    const contacts = [
      ['/geo/', 'gpr-localizar-tubulacoes', 'alvo', 'Tubulações e estruturas enterradas'],
      ['/geo/', 'geofisica-agua-subterranea-poco', 'alvo', 'Água subterrânea'],
      ['/geo/', 'o-que-e-geofisica', 'alvo', ''],
      ['/topo/', 'georreferenciamento-imovel-rural-sigef', 'imovel', 'Rural'],
      ['/safe/', 'monitoramento-geofisico-barragens', 'estrutura', ''],
    ];
    for (const [route, slug, field, value] of contacts) {
      await new Promise(resolve => { frame.onload = resolve; frame.src = `${route}?artigo=${slug}#contato`; });
      const doc = frame.contentDocument;
      const form = doc.querySelector('form[data-form]');
      assert(form.elements[field].value === value, `Interesse preservado: ${slug}`);
      assert(form.elements.assunto.value && form.elements.mensagem.value, `Assunto e mensagem: ${slug}`);
      assert(form.elements.artigo_origem.value.endsWith(`/conteudos/${slug}/`), `Origem: ${slug}`);
      assert(!form.elements.nome.value && !form.elements.email.value, `Sem dados pessoais inventados: ${slug}`);
      const mail = new URL(doc.querySelector('[data-mail]').href);
      assert(mail.searchParams.get('body').includes(slug), `Contexto no e-mail: ${slug}`);
      const fallback = new URL(doc.querySelector('.wa-float').href);
      assert(fallback.pathname === route && fallback.searchParams.get('artigo') === slug, `Contexto no contato flutuante: ${slug}`);
      form.elements.mensagem.value = 'Minha descrição do projeto';
      assert(new frame.contentWindow.FormData(form).get('mensagem') === 'Minha descrição do projeto', 'Mensagem editável');
      messages.push(`PASS contexto ${slug}`);
    }
    for (const [route, slug] of contacts) {
      await new Promise(resolve => { frame.onload = resolve; frame.src = `/conteudos/${slug}/`; });
      const doc = frame.contentDocument;
      const headerContact = [...doc.querySelectorAll('.site-nav a')].find(link => link.textContent.trim() === 'Contato');
      assert(new URL(headerContact.href).searchParams.get('artigo') === slug, `Origem pelo cabeçalho: ${slug}`);
      assert(new URL(doc.querySelector('.wa-float').href).pathname === route, `Área no contato do artigo: ${slug}`);
    }
    await new Promise(resolve => { frame.onload = resolve; frame.src = '/geo/?artigo=__proto__#contato'; });
    assert(!frame.contentDocument.querySelector('[name="artigo_origem"]'), 'Origem desconhecida ignorada');
    await new Promise(resolve => { frame.onload = resolve; frame.src = '/topo/?artigo=gpr-localizar-tubulacoes#contato'; });
    assert(!frame.contentDocument.querySelector('[name="artigo_origem"]'), 'Origem de outra área ignorada');
    await new Promise(resolve => { frame.onload = resolve; frame.src = '/safe/'; });
    const safe = frame.contentDocument;
    assert(parseFloat(safe.querySelector('[data-delta]').textContent) === 0, 'Referência inicial sem variação');
    const range = safe.querySelector('#campanha'); range.value = range.max;
    range.dispatchEvent(new frame.contentWindow.Event('input'));
    assert(safe.querySelector('.s-level').textContent === 'Comparação', 'Simulação sem classificação de segurança');
    assert(safe.querySelector('.s-level').dataset.level === '0', 'Sem semáforo de alerta');
    assert(safe.querySelector('.wa-float').textContent.trim() === 'Contato', 'Nome do canal sem WhatsApp configurado');
    await new Promise(resolve => { frame.onload = resolve; frame.src = '/en/geo/'; });
    const geo = frame.contentDocument;
    geo.querySelector('[data-target="estruturas"]').click();
    assert(geo.querySelector('[data-method="gpr"] [data-text]').textContent.includes('does not guarantee'), 'Limitação do GPR em inglês');
    assert([...geo.querySelectorAll('[data-verdict]')].every(el => el.textContent === 'Illustrative example'), 'Curvas sem promessa de desempenho');
    messages.push('PASS revisão editorial, simulação Safe e inglês');
    document.body.dataset.test = 'PASS'; result.textContent = messages.join('\n');
  } catch (error) { document.body.dataset.test = 'FAIL'; result.textContent = messages.join('\n') + '\nFAIL: ' + error.message; }
})();
</script></body></html>
